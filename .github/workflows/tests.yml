name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported, one in the middle, and the latest stable release
        python-version: ["3.10", "3.12", "3.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install package with test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Run unit tests
        env:
          # The tests/climb suite needs the CLIMB cluster; never run it here
          KUBEXEC_TEST_CLIMB: "0"
        run: python -m pytest tests/unit -v

  package:
    # The unit tests run against the checkout (editable install). This job checks
    # what users actually get: the built sdist/wheel, installed into a clean venv.
    name: Built package (non-editable, Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install the wheel into a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl

      - name: Smoke-test the installed package
        # run away from the checkout so the local kubexec/ folder cannot shadow it
        working-directory: ${{ runner.temp }}
        env:
          REQUIREMENTS_FILE: ${{ github.workspace }}/requirements.txt
        run: |
          VENV_BIN="$RUNNER_TEMP/venv/bin"
          "$VENV_BIN/kubexec" --version
          "$VENV_BIN/kuberlist" --version
          "$VENV_BIN/python" - <<'EOF'
          import os
          from importlib import metadata, util

          import kubexec

          assert "site-packages" in kubexec.__file__, f"imported from {kubexec.__file__}"
          assert metadata.version("kubexec") == kubexec.__version__, "metadata and __version__ differ"

          # nothing but the kubexec package may be installed at top level (e.g. no stray `tests`)
          top_level = metadata.distribution("kubexec").read_text("top_level.txt").split()
          assert top_level == ["kubexec"], f"unexpected top-level packages: {top_level}"
          assert util.find_spec("tests") is None, "a top-level 'tests' package was installed"

          # runtime dependencies in the built package must match requirements.txt
          with open(os.environ["REQUIREMENTS_FILE"]) as fh:
              expected = {line.strip() for line in fh if line.strip() and not line.startswith("#")}
          actual = {r for r in metadata.requires("kubexec") if "extra ==" not in r}
          assert actual == expected, f"requirements differ: {sorted(actual ^ expected)}"

          print("installed package OK:", kubexec.__file__)
          EOF
