name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os
          import re
          from pathlib import Path

          version = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              Path("kubexec/__init__.py").read_text(encoding="utf-8"),
              re.M,
          ).group(1)
          tag = os.environ["TAG"].removeprefix("v")
          assert tag == version, f"release tag {os.environ['TAG']!r} does not match kubexec.__version__ {version!r}"
          print(f"tag {os.environ['TAG']} matches version {version}")
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e '.[test]'

      - name: Run unit tests
        env:
          KUBEXEC_TEST_CLIMB: "0"
        run: python -m pytest tests/unit

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kubexec
    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
